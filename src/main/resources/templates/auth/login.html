<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-100 text-slate-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — Seneca HR</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['"Inter"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css">
    <style>
        body, input, button, select, textarea {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .la, .las, .lar, .lab, [class*="la-"] {
            font-family: 'Line Awesome Free' !important;
            font-style: normal;
        }
        .lab {
            font-family: 'Line Awesome Brands' !important;
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 bg-slate-100 font-sans" x-data="{ email: '', password: '' }">

<div class="w-full max-w-md">
    <!-- Header / Brand -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-purple-700 text-white mb-4 shadow-lg shadow-purple-700/20">
            <i class="las la-fingerprint text-3xl"></i>
        </div>
        <h1 class="text-2xl font-black tracking-tight text-slate-900 flex items-center justify-center gap-2">
            Seneca <span class="text-purple-700 font-bold text-xs uppercase px-2.5 py-0.5 rounded-full bg-purple-100 border border-purple-200">HR Engine</span>
        </h1>
        <p class="text-slate-500 text-sm mt-1.5 font-medium">Sistem Manajemen Multi-Tenant & Otentikasi Biometrik</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-purple-700 via-indigo-600 to-purple-400"></div>

        {#if error}
        <div class="mb-5 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-start gap-2.5">
            <i class="las la-exclamation-circle text-lg text-red-600 mt-0.5 shrink-0"></i>
            <div>{error}</div>
        </div>
        {/if}

        <form method="POST" action="/login" class="space-y-4">
            <input type="hidden" name="redirect" value="{redirect ?: ''}">

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                    Email Pengguna
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="las la-envelope text-lg"></i>
                    </div>
                    <input type="email" name="email" x-model="email" required
                           placeholder="nama@perusahaan.com"
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600/20 focus:border-purple-600 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                    Kata Sandi
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="las la-lock text-lg"></i>
                    </div>
                    <input type="password" name="password" x-model="password" required
                           placeholder="••••••••••••"
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600/20 focus:border-purple-600 transition-all">
                </div>
            </div>

            <button type="submit"
                    class="w-full mt-2 py-2.5 px-4 bg-purple-700 hover:bg-purple-800 active:bg-purple-900 text-white font-semibold text-sm rounded-xl shadow-md shadow-purple-700/20 transition-all flex items-center justify-center gap-2">
                <span>Masuk ke Seneca HR</span>
                <i class="las la-arrow-right text-base"></i>
            </button>
        </form>

        <!-- Quick Demo Credentials -->
        <div class="mt-6 pt-5 border-t border-slate-100">
            <p class="text-xs text-slate-500 mb-2 font-medium text-center">Akun Akses Uji Coba Cepat:</p>
            <div class="grid grid-cols-2 gap-2">
                <button type="button"
                        @click="email='sysadmin@seneca.local'; password='Admin@Seneca2026!'"
                        class="px-3 py-2 rounded-xl bg-purple-50 hover:bg-purple-100 text-xs text-purple-800 border border-purple-200 text-center font-medium transition-colors">
                    <i class="las la-shield-alt mr-1"></i> Sysadmin (Super)
                </button>
                <button type="button"
                        @click="email='owner@seneca.local'; password='Admin@Seneca2026!'"
                        class="px-3 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-xs text-amber-800 border border-amber-200 text-center font-medium transition-colors">
                    <i class="las la-crown mr-1"></i> Owner Tenant
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="mt-6 text-center text-xs text-slate-400">
        &copy; 2026 Seneca HR Engine. PatternFly Enterprise Design System.
    </div>
</div>

</body>
</html>
