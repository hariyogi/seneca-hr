<!-- Top Header / Masthead -->
<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 lg:px-8 sticky top-0 z-30 shadow-xs">
    <!-- Left: Collapse / Hamburger Toggles + Title -->
    <div class="flex items-center gap-3">
        <!-- Mobile Drawer Toggle -->
        <button @click="mobileOpen = !mobileOpen"
                class="lg:hidden p-2 text-slate-600 hover:text-purple-700 hover:bg-slate-100 rounded-lg transition-colors"
                title="Buka Menu">
            <i class="las la-bars text-xl"></i>
        </button>

        <!-- Desktop Quick Collapse Toggle -->
        <button @click="sidebarCollapsed = !sidebarCollapsed"
                class="hidden lg:flex p-2 text-slate-500 hover:text-purple-700 hover:bg-slate-100 rounded-lg transition-colors"
                :title="sidebarCollapsed ? 'Perluas Sidebar' : 'Ciutkan Sidebar'">
            <i class="las la-bars text-xl"></i>
        </button>

        <div class="flex items-center gap-2">
            <span class="font-bold text-slate-900 tracking-tight text-sm sm:text-base">{title ?: 'Seneca HR Engine'}</span>
            {#if subtitle}
            <span class="hidden md:inline-block text-xs text-slate-400 font-normal">| {subtitle}</span>
            {/if}
        </div>
    </div>

    <!-- Right: User Information & Logout Button (Top Right Corner) -->
    <div class="flex items-center gap-3 sm:gap-4">
        <!-- User Profile Pill -->
        <div class="flex items-center gap-3 pl-3 py-1 bg-slate-50 border border-slate-200 rounded-full pr-1.5 shadow-xs">
            <div class="w-8 h-8 rounded-full bg-purple-100 border border-purple-200 flex items-center justify-center font-bold text-xs text-purple-700 uppercase shrink-0">
                {session.fullName.substring(0, 1)}
            </div>
            <div class="hidden sm:block text-left pr-1">
                <div class="text-xs font-bold text-slate-800 leading-tight">{session.fullName}</div>
                <div class="text-[10px] text-slate-500 truncate max-w-[140px]">{session.email}</div>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider shrink-0 {#if session.isSuper}bg-purple-100 text-purple-800 border border-purple-300{#else if session.isOwner}bg-amber-100 text-amber-800 border border-amber-300{#else}bg-slate-200 text-slate-700{/if}">
                {#if session.isSuper}SUPER{#else if session.isOwner}OWNER{#else}{session.currentRole.toUpperCase()}{/if}
            </span>
        </div>

        <!-- Logout Action Button -->
        <a href="/logout"
           class="flex items-center gap-1.5 px-3 py-2 text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-xl transition-all shadow-xs"
           title="Keluar dari Sesi">
            <i class="las la-sign-out-alt text-base"></i>
            <span class="hidden md:inline">Keluar</span>
        </a>
    </div>
</header>
